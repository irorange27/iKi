name: Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ponytail: pnpm-lock.yaml records @electron/node-gyp as an SSH remote and runners have
      # no deploy key. Re-record it over HTTPS (`pnpm update @electron/node-gyp`) and drop this.
      - name: Prefer HTTPS for GitHub git fetches
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + Typecheck + Tests + Coverage
        run: pnpm run -s ci:quality
