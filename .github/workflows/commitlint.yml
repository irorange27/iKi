name: Commitlint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ponytail: pnpm-lock.yaml records @electron/node-gyp as an SSH remote and runners have
      # no deploy key. Re-record it over HTTPS (`pnpm update @electron/node-gyp`) and drop this.
      - name: Prefer HTTPS for GitHub git fetches
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commits in PR range
        run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
