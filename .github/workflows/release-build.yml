name: Release Build

on:
  push:
    branches:
      - main
    paths:
      - package.json
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.event.release.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (lockfile sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify lockfile with npm ci
        run: npm ci --ignore-scripts

  build:
    name: Build (${{ matrix.label }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: darwin-arm64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        run: npm run make
        env:
          CI: "1"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: make-${{ matrix.label }}
          path: |
            out/make/**/*
            out/iki-*/**/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: make-*
          path: release-artifacts

      - name: Verify downloaded files
        run: |
          if ! find release-artifacts -type f | grep -q .; then
            echo "No release artifacts found."
            exit 1
          fi

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-artifacts/**/*
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
