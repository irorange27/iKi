name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: false
        default: main

permissions:
  contents: write

env:
  NODE_VERSION: "22"

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      changelog_path: ${{ steps.meta.outputs.changelog_path }}
    steps:
      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          checkout_ref="${{ github.event.inputs.ref || github.ref }}"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            release_tag="${{ github.ref_name }}"
            release_version="${release_tag#v}"
            changelog_path="changelogs/${release_tag}.md"

            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
            echo "changelog_path=$changelog_path" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_version=" >> "$GITHUB_OUTPUT"
            echo "changelog_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release metadata
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        run: |
          if [[ ! -f "${{ steps.meta.outputs.changelog_path }}" ]]; then
            echo "Missing curated release notes at ${{ steps.meta.outputs.changelog_path }}"
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "${{ steps.meta.outputs.release_version }}" ]]; then
            echo "package.json version ($package_version) does not match tag ${{ steps.meta.outputs.release_tag }}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release quality gate
        run: pnpm run -s ci:quality

  build:
    name: Build (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: darwin-arm64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build distributables
        run: pnpm run -s app:build
        env:
          CI: "1"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            out/make/**/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft release
    if: needs.verify.outputs.should_publish == 'true'
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify downloaded files
        run: |
          if ! find release-artifacts -type f | grep -q .; then
            echo "No release artifacts found."
            exit 1
          fi

      - name: Generate SHA256 manifest
        shell: bash
        run: |
          cd release-artifacts
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Upload assets to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          name: iki ${{ needs.verify.outputs.release_tag }}
          body_path: ${{ needs.verify.outputs.changelog_path }}
          draft: true
          files: |
            release-artifacts/**/*
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
