name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: false
        default: main

permissions:
  contents: write

env:
  NODE_VERSION: "24"

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          checkout_ref="${{ github.event.inputs.ref || github.ref }}"

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            release_tag="${{ github.ref_name }}"
            release_version="${release_tag#v}"

            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release version
        if: steps.meta.outputs.should_publish == 'true'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "${{ steps.meta.outputs.release_version }}" ]]; then
            echo "package.json version ($package_version) does not match tag ${{ steps.meta.outputs.release_tag }}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release quality gate
        run: pnpm run -s ci:quality

  build-publish:
    name: Build and publish (darwin-arm64)
    if: needs.verify.outputs.should_publish == 'true'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm exec electron-rebuild

      - name: Build distributables
        run: pnpm exec electron-forge make --targets @electron-forge/maker-zip,@electron-forge/maker-dmg
        env:
          CI: "1"

      - name: Generate SHA256 manifest
        shell: bash
        run: |
          cd out/make
          find . -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          release_notes_path="release-notes.md"
          node scripts/scaffold-changelog.cjs \
            --version "${{ needs.verify.outputs.release_tag }}" \
            --to "${{ needs.verify.outputs.checkout_ref }}" \
            --dry-run > "$release_notes_path"

          echo "path=$release_notes_path" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          name: iki ${{ needs.verify.outputs.release_tag }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          files: |
            out/make/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release notes reflect latest changelog
        shell: bash
        run: |
          gh release edit "${{ needs.verify.outputs.release_tag }}" \
            --notes-file "${{ steps.notes.outputs.path }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
