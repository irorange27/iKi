name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve token mode
        id: token-mode
        run: |
          if [ -n "${{ secrets.RELEASE_PLEASE_TOKEN }}" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "Using RELEASE_PLEASE_TOKEN."
          else
            echo "mode=github-token" >> "$GITHUB_OUTPUT"
            echo "RELEASE_PLEASE_TOKEN is not set."
            echo "Falling back to GITHUB_TOKEN."
            echo "If PR creation fails, either set RELEASE_PLEASE_TOKEN"
            echo "or enable Settings -> Actions -> General -> Workflow permissions ->"
            echo "\"Allow GitHub Actions to create and approve pull requests\"."
          fi

      - name: Run release-please (PAT)
        if: steps.token-mode.outputs.mode == 'pat'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run release-please (GITHUB_TOKEN fallback)
        if: steps.token-mode.outputs.mode == 'github-token'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
