<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 568" width="920" height="568" role="img" aria-label="iKi CLI showcasing MCP Code Mode, TypeScript PTC sandbox, and live Swarm activity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; }
      .dim { fill: #7d8590; }
      .fg { fill: #e6edf3; }
      .cyan { fill: #79c0ff; }
      .green { fill: #3fb950; }
      .amber { fill: #d29922; }
      .purple { fill: #d2a8ff; }
      .muted { fill: #9198a1; }
      .bold { font-weight: 600; }
    </style>
  </defs>

  <!-- Outer frame -->
  <rect x="0.5" y="0.5" width="919" height="567" rx="12" fill="url(#bg)" stroke="#30363d"/>

  <!-- Title bar -->
  <path d="M 12 1 H 908 A 11 11 0 0 1 919 12 V 38 H 1 V 12 A 11 11 0 0 1 12 1 Z" fill="#161b22"/>
  <line x1="1" y1="38.5" x2="919" y2="38.5" stroke="#21262d"/>
  <circle cx="22" cy="19.5" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="19.5" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="19.5" r="5.5" fill="#27c93f"/>
  <text x="460" y="23.5" text-anchor="middle" class="title dim">iki — ~/workspace/iki (TUI · KV-Cache-First Agent Harness)</text>

  <!-- Banner -->
  <text x="24" y="64" class="mono fg bold">iKi CLI</text>
  <text x="86" y="64" class="mono dim">— deepseek/deepseek-chat · thread: cli_25593101</text>
  <text x="896" y="64" text-anchor="end" class="mono green">KV-cache prefix frozen ✓</text>

  <text x="24" y="86" class="mono dim">[Tools] 3 static builtin (bash, job, ptc) · MCP: enabled · mode=code · 2/2 connected · 10 tool(s)</text>
  <text x="24" y="105" class="mono cyan">[MCP L0] 748 chars anchored delta · calc (inline TS) · inventory (8 tools → mcp.describe("inventory"))</text>

  <!-- /mcp dts card -->
  <rect x="24" y="120" width="872" height="94" rx="7" fill="#131922" stroke="#21262d"/>
  <rect x="24" y="120" width="3.5" height="94" rx="2" fill="#58a6ff"/>
  <text x="38" y="140" class="mono cyan bold">&gt; /mcp dts calc</text>
  <text x="38" y="160" class="mono purple">declare namespace mcp.calc {</text>
  <text x="54" y="178" class="mono fg">function add(args: { a: number; b: number }): Promise&lt;McpResult&gt;;</text>
  <text x="54" y="196" class="mono fg">function square(args: { n: number }): Promise&lt;McpResult&gt;;</text>
  <text x="38" y="210" class="mono purple">}</text>

  <!-- User prompt -->
  <text x="24" y="238" class="mono amber bold">You:</text>
  <text x="62" y="238" class="mono fg">In one ptc call, square [3, 5, 7] via calc in parallel, inspect inventory signatures, and list in-stock SKUs.</text>

  <!-- PTC tool execution card -->
  <rect x="24" y="252" width="872" height="132" rx="7" fill="#111820" stroke="#21262d"/>
  <rect x="24" y="252" width="3.5" height="132" rx="2" fill="#3fb950"/>
  <text x="38" y="272" class="mono green bold">✓ ptc</text>
  <text x="86" y="272" class="mono dim">TypeScript sandbox (node:vm + stripTypeScriptTypes) · 4 MCP calls · 0 top-level MCP schemas</text>
  <text x="38" y="294" class="mono muted">const squares = await Promise.all([3, 5, 7].map(n =&gt; mcp.calc.square({ n })));</text>
  <text x="38" y="312" class="mono muted">const dts = mcp.describe("inventory");  // on-demand L1 TypeScript declarations</text>
  <text x="38" y="330" class="mono muted">const stock = await mcp.inventory.list_stock({ inStockOnly: true });</text>
  <text x="38" y="348" class="mono muted">return { sum: squares.reduce((s, r) =&gt; s + r.data.squared, 0), inStock: stock.data };</text>
  <text x="38" y="372" class="mono cyan">↳ { sum: 83, inStock: ["Mechanical Keyboard (A1, qty 12)", "4K Monitor (C3, qty 5)"] }</text>

  <!-- Assistant response -->
  <text x="24" y="408" class="mono fg bold">iKi:</text>
  <text x="62" y="408" class="mono fg">Sum of squares (3² + 5² + 7²) = 83. In-stock items (2): Mechanical Keyboard (A1), 4K Monitor (C3).</text>
  <text x="62" y="427" class="mono dim">[in 5,461 · cache 89% · out 47 · 6.9s]</text>

  <!-- Live Swarm & Jobs activity strip -->
  <rect x="24" y="446" width="872" height="58" rx="7" fill="#161b22" stroke="#30363d"/>
  <circle cx="40" cy="466" r="4.5" fill="#3fb950"/>
  <text x="52" y="470" class="mono fg bold">Swarm: 2 workers active</text>
  <text x="234" y="470" class="mono dim">(git worktree) · </text>
  <text x="358" y="470" class="mono cyan">reviewer-1</text>
  <text x="434" y="470" class="mono dim">running bash · </text>
  <text x="546" y="470" class="mono purple">refactor-2</text>
  <text x="622" y="470" class="mono dim">thinking</text>
  <text x="882" y="470" text-anchor="end" class="mono amber">Ctrl+W watch</text>

  <circle cx="40" cy="489" r="4.5" fill="#d29922"/>
  <text x="52" y="493" class="mono fg">Background Jobs: 1 running</text>
  <text x="260" y="493" class="mono dim">job_9f2a · pnpm exec vitest run · 14.2s</text>
  <text x="882" y="493" text-anchor="end" class="mono amber">Ctrl+J tail / kill</text>

  <!-- Prompt & footer -->
  <line x1="24" y1="520" x2="896" y2="520" stroke="#21262d"/>
  <text x="24" y="544" class="mono cyan bold">❯</text>
  <text x="42" y="544" class="mono dim">Ask anything, /mcp, /swarm, /jobs, /models, /skills...</text>
  <text x="896" y="544" text-anchor="end" class="mono dim">mcp:10t(code) · 3 builtin · Ctrl+T thinking</text>
</svg>
